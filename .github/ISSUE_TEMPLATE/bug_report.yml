name: Bug report
description: An effect looks wrong, stutters or breaks something
labels: [bug]
body:
  - type: input
    id: effect
    attributes:
      label: Effect
      placeholder: scramble-text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected instead. A short screen recording helps a lot.
    validations:
      required: true
  - type: dropdown
    id: flavour
    attributes:
      label: Flavour
      options: [React, Astro, Plain TypeScript / HTML]
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Safari 19, iOS 26
